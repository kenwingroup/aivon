# ============================================================================
# AIVON - BUILD TỪ SOURCE (thay vì pull image GHCR).
#   docker compose -f docker-compose.build.yml up -d --build
# Dùng khi: tự host registry riêng, fork sửa code, hoặc test image trước khi đẩy.
# ============================================================================
services:
  aivon:
    build:
      context: .
      args:
        CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-latest}
    image: ghcr.io/blogminhquy/javis-os:latest
    container_name: ${AIVON_NAME:-aivon}          # đổi trong .env khi chạy nhiều bản trên một máy
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${AIVON_HOST_PORT:-7979}:7979"
    volumes:
      - aivon-data:/data
      - aivon-brains:/brains      # đổi sang  ./brains:/brains  nếu muốn git-backup (chown -R 10001 ./brains)
      - claude-auth:/home/aivon/.claude
      - codex-auth:/home/aivon/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.getenv('AIVON_PORT','7979')+'/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  aivon-data:
  aivon-brains:
  claude-auth:
  codex-auth:
