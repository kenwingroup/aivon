name: Điều khiển app trên máy
name_en: "Control apps on this computer"
slug: desktop-apps
version: 1.0.0
description: Mở, đóng và liệt kê ứng dụng trên CHÍNH MÁY đang chạy Aivon (Windows, macOS, Linux có màn hình) theo lời người dùng, ví dụ "mở Chrome", "tắt Excel", "đang mở app nào". Tự chặn và nói rõ khi Aivon chạy trong Docker trên máy chủ, vì khi đó máy chạy Aivon không phải máy của người dùng.
description_en: "Opens, closes and lists apps on THE MACHINE running Aivon (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when Aivon runs in Docker on a server, because then the machine running Aivon is not yours."
author: Aivon (bundled)
enabled: true
min_mode: safe
tools:
  - aivon_app_list
  - aivon_app_open
  - aivon_app_close
hooks: []
