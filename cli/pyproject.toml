[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivon-cli"
version = "0.17.0"
description = "Aivon CLI - nói chuyện với AIVON từ terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AIVON" }]
keywords = ["aivon", "cli", "ai", "agent", "second-brain"]

# CHỈ httpx. Đây là một luật, không phải sự tình cờ: gói này phải cài được trên máy chưa từng
# có Aivon, và mọi thứ kéo thêm (fastapi, uvicorn, rich...) đều là thứ người dùng phải tải về
# chỉ để gõ một câu hỏi. Có test canh đúng danh sách này.
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/kenwingroup/aivon"
Documentation = "https://github.com/kenwingroup/aivon/blob/main/docs/dev/2026-08-cli-spec.md"

[project.scripts]
aivon = "aivon_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["aivon_cli*"]
