# ============================================================================
# AIVON - override để chạy NHIỀU BẢN trên cùng một VPS, mỗi bản một tên miền riêng.
#
# Dùng KÈM docker-compose.yml, và cần proxy dùng chung đã chạy trước
# (docker-compose.proxy.yml - làm một lần cho cả máy).
#
# CÁCH DÙNG - mỗi bản một THƯ MỤC RIÊNG:
#
#   mkdir -p ~/aivon-shop && cd ~/aivon-shop
#   curl -fsSLO https://raw.githubusercontent.com/kenwingroup/aivon/main/docker-compose.yml
#   curl -fsSLO https://raw.githubusercontent.com/kenwingroup/aivon/main/docker-compose.multi.yml
#   cat > .env <<'EOF'
#   AIVON_NAME=aivon-shop
#   AIVON_HOST_PORT=7979
#   AIVON_BIND=127.0.0.1
#   DOMAIN_NAME=shop.tencuaban.com
#   AIVON_ADMIN_USER=admin
#   AIVON_ADMIN_PASSWORD=mat-khau-manh-rieng-cho-ban-nay
#   EOF
#   chmod 600 .env
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml run --rm aivon claude auth login --claudeai
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml up -d
#
# Bản thứ hai làm y hệt ở thư mục khác, đổi CẢ BA giá trị trong .env:
#   AIVON_NAME=aivon-ca-nhan   AIVON_HOST_PORT=7778   DOMAIN_NAME=canhan.tencuaban.com
#
# BA GIÁ TRỊ ĐÓ PHẢI KHÁC NHAU GIỮA CÁC BẢN. Trùng AIVON_NAME thì Docker báo tên container đã
# dùng; trùng AIVON_HOST_PORT thì báo cổng đã bị chiếm; trùng DOMAIN_NAME thì hai bản giành nhau
# một tên miền và proxy chỉ lái được về một bản.
#
# MỖI BẢN LÀ MỘT AIVON ĐỘC LẬP HOÀN TOÀN: thư mục khác nhau -> tên project khác nhau -> volume
# khác nhau, nên state, brain, tài khoản admin, token đăng nhập Claude/ChatGPT đều riêng. Muốn
# hai bản DÙNG CHUNG một lần đăng nhập Claude thì trỏ chung volume claude-auth (nâng cao, tự lo).
#
# KHÁC docker-compose.https.yml: file kia dựng Caddy NẰM TRONG project của Aivon, đúng cho máy
# chỉ chạy MỘT bản (tên miền nhập trong app, on-demand TLS). Nhiều bản thì Caddy phải đứng ngoài,
# nên tên miền chuyển sang khai ở .env - giống hệt cách bản Hostinger đang làm.
# ============================================================================
services:
  aivon:
    # CỐ Ý KHÔNG khai `ports` ở đây: compose NỐI CHỒNG danh sách ports giữa các file -f chứ không
    # thay thế, nên khai lại là ra hai binding cùng một cổng và Docker báo "port is already
    # allocated". Việc thu cổng về loopback làm bằng AIVON_BIND=127.0.0.1 trong .env (xem đầu file).
    networks:
      - default        # phải liệt kê lại: khai networks ở service là THAY danh sách, không cộng thêm
      - aivon-web
    labels:
      # Proxy dùng chung đọc đúng hai nhãn này rồi tự dựng site + xin chứng chỉ.
      caddy: ${DOMAIN_NAME:?DOMAIN_NAME chưa đặt - thêm DOMAIN_NAME=ten-mien-cua-ban vào .env}
      caddy.reverse_proxy: "{{upstreams 7979}}"

networks:
  aivon-web:
    external: true
    name: aivon-web
